name: CI/CD Pipeline (Frontend Only)

on:
  push:
    branches: [ "main", "dev" ]

jobs:
  # Tự động build và deploy Frontend lên Firebase Hosting
  deploy-frontend:
    runs-on: ubuntu-latest
    # Đã xóa 'needs: deploy-backend' để job này tự chạy luôn không cần chờ backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: ./RecycleRewards_FE
        env:
          VITE_API_URL: https://recycle-rewards.duckdns.org/api
          VITE_BUILD_SHA: ${{ github.sha }}
        run: |
          npm install
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_RECYCLE_REWARDS_2026 }}'
          channelId: live
          projectId: recycle-rewards-2026
          entryPoint: ./RecycleRewards_FE
