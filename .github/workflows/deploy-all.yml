name: CI/CD Pipeline (Backend & Frontend)

on:
  push:
    branches: [ "main", "dev" ]

jobs:
  # Job 1: Tự động deploy Backend lên AWS EC2
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Connect and Update Backend on EC2
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          BRANCH: ${{ github.ref_name }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RECYCLE_REWARDS_2026 }}
        run: |
          SERVICE_ACCOUNT_B64=$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | base64 -w 0)
          ssh -o StrictHostKeyChecking=no $USER@$HOST "BRANCH='$BRANCH' ADMIN_EMAILS='$ADMIN_EMAILS' SERVICE_ACCOUNT_B64='$SERVICE_ACCOUNT_B64' bash -s" << 'EOF'
            BACKEND_DIR=$(find ~ -type d -path "*/RecycleRewards_BE" 2>/dev/null | head -n 1)
            
            if [ -z "$BACKEND_DIR" ]; then
              echo "Không tìm thấy thư mục RecycleRewards_BE trên EC2!"
              exit 1
            fi

            REPO_DIR=$(git -C "$BACKEND_DIR" rev-parse --show-toplevel)
            echo "Đang deploy repo: $REPO_DIR"
            cd "$REPO_DIR"

            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
            cd "$BACKEND_DIR"
            npm install

            if [ -n "$SERVICE_ACCOUNT_B64" ]; then
              printf '%s' "$SERVICE_ACCOUNT_B64" | base64 -d > "$BACKEND_DIR/firebase-service-account.json"
            fi
            export GOOGLE_APPLICATION_CREDENTIALS="$BACKEND_DIR/firebase-service-account.json"
            
            # Kiểm tra và tự động cài đặt PM2 nếu trên server chưa có
            export PATH=$PATH:/home/ubuntu/.npm/bin:/usr/bin:/usr/local/bin
            if ! command -v pm2 &> /dev/null; then
              echo "PM2 chưa được cài đặt, đang tiến hành cài đặt..."
              sudo npm install -g pm2
            fi
            
            # Restart hoặc start mới app nếu chưa tồn tại process recycle-backend
            export ADMIN_EMAILS="${ADMIN_EMAILS:-caothaiduongmcpe123@gmail.com}"
            if pm2 describe recycle-backend > /dev/null 2>&1; then
              pm2 restart recycle-backend --update-env
            else
              pm2 start server.js --name recycle-backend
            fi
            
            pm2 save

            # YOLO/FastAPI runs in one warm container. The Nginx /ai/ proxy is
            # configured once from deploy/nginx-ai.conf; this publish is local only.
            # Cài Docker Engine + Compose v2 tự động ở lần deploy đầu tiên.
            # Dùng sudo docker ở script deploy để không cần logout/login sau
            # khi user ubuntu được thêm vào nhóm docker.
            if ! command -v docker > /dev/null 2>&1; then
              echo "Docker chưa có, đang cài Docker Engine và Compose plugin..."
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl
              sudo install -m 0755 -d /etc/apt/keyrings
              sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
              sudo chmod a+r /etc/apt/keyrings/docker.asc
              . /etc/os-release
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            fi
            sudo systemctl enable --now docker
            sudo docker compose version
            cd "$REPO_DIR"
            chmod +x deploy/deploy-ai.sh
            ./deploy/deploy-ai.sh "$REPO_DIR"
          EOF

  # Job 2: Tự động build và deploy Frontend lên Firebase Hosting
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend 
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: ./RecycleRewards_FE
        env:
          VITE_API_URL: https://recycle-rewards.duckdns.org/api
          VITE_AI_API_URL: https://recycle-rewards.duckdns.org/ai
          VITE_BUILD_SHA: ${{ github.sha }}
        run: |
          npm install
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_RECYCLE_REWARDS_2026 }}'
          channelId: live
          projectId: recycle-rewards-2026
          entryPoint: ./RecycleRewards_FE
