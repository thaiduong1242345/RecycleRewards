# Include this `location` block in the existing HTTPS server block for
# recycle-rewards.duckdns.org, then run: sudo nginx -t && sudo systemctl reload nginx
# The trailing slash is important: /ai/api/v1/detect becomes /api/v1/detect.
location /ai/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 4m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}
