services:
  recycle-ai:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    image: recycle-rewards-ai:latest
    restart: unless-stopped
    environment:
      # Comma-separated allow-list; update with every deployed frontend domain.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://recycle-rewards-2026.web.app,http://localhost:5173}
      YOLO_CONFIDENCE: ${YOLO_CONFIDENCE:-0.45}
      YOLO_IMAGE_SIZE: ${YOLO_IMAGE_SIZE:-320}
      MAX_BOX_AREA_RATIO: ${MAX_BOX_AREA_RATIO:-0.85}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-4194304}
    # Do not expose inference directly to the Internet. Nginx proxies /ai/.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
